name: Release dry-run

on:
  push:
    branches: [feat/update-check]

permissions:
  contents: write

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      app_version: ${{ steps.version.outputs.app_version }}
      rebuild: ${{ steps.version.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate manifest.json
        run: python -c "import json; json.load(open('manifest.json'))"

      # Первые три числа тега обязаны совпадать с манифестом: по ним расширение и
      # приложения понимают, что вышла новая версия. Четвёртое число значит
      # пересборку того же кода (см. auto-update.yml).
      - name: Compare tag with manifest
        id: version
        env:
          TAG: v3.14.0.99
        run: |
          app_version=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          IFS=. read -r major minor patch build <<< "${TAG#v}"
          if [ "$major.$minor.$patch" != "$app_version" ]; then
            echo "::error::Тег $TAG не совпадает с версией в manifest.json ($app_version)"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "app_version=$app_version"
            echo "rebuild=$([ -n "$build" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  extension:
    name: Build extension .zip
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build zip
        id: zip
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -e
          OUT="music-downloader-extension-${TAG}.zip"
          mkdir -p out
          zip -r "out/${OUT}" \
            manifest.json \
            background.js \
            content.js content.css \
            popup.html popup.js popup.css \
            offscreen.html offscreen.js \
            lib services inject icons \
            README.md
          echo "out=out/${OUT}" >> "$GITHUB_OUTPUT"
          echo "name=${OUT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: ${{ steps.zip.outputs.out }}

  desktop:
    name: Build desktop .exe (Windows)
    needs: prepare
    runs-on: windows-latest
    outputs:
      ytdlp: ${{ steps.smoke.outputs.ytdlp }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: desktop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Stamp version
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: echo "VERSION = '${TAG#v}'" > desktop/version.py

      - name: Build .exe
        working-directory: desktop
        run: python build.py

      # Публикация может идти без участия человека (auto-update.yml), поэтому
      # сломанная сборка не должна дойти до людей: запускаем exe по-настоящему.
      - name: Smoke test
        id: smoke
        working-directory: desktop/dist
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:MD_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $p = Start-Process -FilePath .\MusicDownloader.exe -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw 'exe завис при запуске' }
          if (-not (Test-Path $env:MD_SMOKE_REPORT)) { throw "exe завершился без отчёта, код $($p.ExitCode)" }
          $report = Get-Content $env:MD_SMOKE_REPORT -Raw
          Write-Host $report
          if ($report -notmatch '^ok yt-dlp=(\S+)') { throw 'Проверка exe не прошла' }
          "ytdlp=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Rename binary
        working-directory: desktop/dist
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: Rename-Item -Path "MusicDownloader.exe" -NewName "MusicDownloader-$env:TAG.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: desktop/dist/MusicDownloader-*.exe

  lite:
    name: Build Lite .exe (Windows 7)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Python 3.8 — последний с поддержкой Windows 7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Install dependencies
        working-directory: lite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Stamp version
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: echo "VERSION = '${TAG#v}'" > lite/version.py

      - name: Build .exe
        working-directory: lite
        run: python build.py

      - name: Smoke test
        working-directory: lite/dist
        shell: pwsh
        run: |
          $env:MD_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $p = Start-Process -FilePath .\MusicDownloader-Lite.exe -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw 'exe завис при запуске' }
          if (-not (Test-Path $env:MD_SMOKE_REPORT)) { throw "exe завершился без отчёта, код $($p.ExitCode)" }
          $report = Get-Content $env:MD_SMOKE_REPORT -Raw
          Write-Host $report
          if ($report -notmatch '^ok') { throw 'Проверка exe не прошла' }

      - name: Rename binary
        working-directory: lite/dist
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: Rename-Item -Path "MusicDownloader-Lite.exe" -NewName "MusicDownloader-Lite-$env:TAG.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: lite-windows
          path: lite/dist/MusicDownloader-Lite-*.exe

  android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease -PappVersion=${{ needs.prepare.outputs.app_version }} --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android/app/build/outputs/apk/release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: mv app-release.apk "MusicDownloader-$TAG.apk"

      # Без подписи Android откажется устанавливать пакет, а сборка при этом
      # проходит без ошибок — поэтому проверяем явно.
      - name: Verify APK signature
        working-directory: android/app/build/outputs/apk/release
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose MusicDownloader-*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/MusicDownloader-*.apk

  release:
    name: Publish release
    needs: [prepare, extension, desktop, lite, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/**/*

      # Контрольные суммы, чтобы можно было проверить подлинность файлов
      - name: Compute checksums
        id: sums
        run: |
          cd artifacts
          echo "text<<CHECKSUMS_EOF" >> "$GITHUB_OUTPUT"
          find . -type f -regex ".*\.\(apk\|exe\|zip\)" -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s|\./[^/]*/||" >> "$GITHUB_OUTPUT"
          echo "CHECKSUMS_EOF" >> "$GITHUB_OUTPUT"

      - name: Create / update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/extension-zip/*.zip
            artifacts/desktop-windows/*.exe
            artifacts/lite-windows/*.exe
            artifacts/android-apk/*.apk
          body: |
            ${{ needs.prepare.outputs.rebuild == 'true' && '> **Автоматическая пересборка со свежим yt-dlp.** Код не менялся. Обновиться стоит только десктопной программе: YouTube и другие сайты часто меняют защиту, и новый yt-dlp это учитывает. Расширению, Android и версии для Windows 7 обновление не нужно.' || '' }}

            ## Что внутри

            - **`music-downloader-extension-*.zip`** — расширение для Chromium-браузеров (Edge / Chrome / Яндекс.Браузер). Распакуй → `chrome://extensions` → «Режим разработчика» → «Загрузить распакованное» → выбери папку. Чтобы обновить, распакуй поверх старой папки и нажми круглую стрелку на карточке расширения.
            - **`MusicDownloader-*.exe`** — десктоп для Windows 10/11. 1800+ сайтов (YouTube, SoundCloud, VK…). Просто запусти. Для конвертации нужен `ffmpeg.exe` рядом ([взять тут](https://github.com/yt-dlp/FFmpeg-Builds/releases)).
            - **`MusicDownloader-*.apk`** — приложение для **Android** (7.0 и новее). Скачайте и установите, разрешив установку из этого источника.
            - **`MusicDownloader-Lite-*.exe`** — версия для **Windows 7** (там основной десктоп не запускается). Яндекс.Музыка (FLAC / MP3 + обложка + теги + текст) + YouTube/SoundCloud/Bandcamp/VK через yt-dlp.

            В десктопе: yt-dlp ${{ needs.desktop.outputs.ytdlp }}
            <!-- yt-dlp: ${{ needs.desktop.outputs.ytdlp }} -->

            ---

            <details>
            <summary>Контрольные суммы SHA-256</summary>

            ```
            ${{ steps.sums.outputs.text }}
            ```

            Проверить в Windows: `certutil -hashfile ИМЯ_ФАЙЛА SHA256`

            </details>

            > **Про предупреждения браузера и антивируса.** Windows SmartScreen и Play Защита могут сообщить о «неизвестном разработчике» или пометить файл подозрительным. Так происходит со всеми программами, которые распространяются вне магазинов приложений и не подписаны платным сертификатом разработчика. Весь исходный код открыт, сборка выполняется автоматически из этого репозитория, а суммы выше позволяют убедиться, что файл не подменён.

            См. [README](https://github.com/${{ github.repository }}#readme) для подробностей.
