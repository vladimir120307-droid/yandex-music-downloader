name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"

      - name: Syntax-check JS files
        run: |
          set -e
          for f in background.js content.js popup.js lib/*.js services/*.js inject/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile-check Python files
        run: |
          python -m py_compile downloader.py
          python -m py_compile desktop/main.py desktop/window.py desktop/core.py desktop/settings.py desktop/ffmpeg_helper.py desktop/build.py desktop/yandex_music.py desktop/ffmpeg_installer.py desktop/update_check.py desktop/version.py
          python -m py_compile lite/main.py lite/yandex_music.py lite/ffmpeg_helper.py lite/ytdlp_worker.py lite/build.py lite/update_check.py lite/version.py

      # Эти файлы намеренно лежат копиями в desktop/ и lite/
      - name: Shared Python files are identical
        run: |
          diff desktop/yandex_music.py lite/yandex_music.py
          diff desktop/update_check.py lite/update_check.py

  e2e:
    name: Extension in Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Без запросов к Яндексу: зарубежным IP раннеров он отвечает 451
      - name: Run tests
        run: node tests/e2e.mjs ci

  android:
    name: Android build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v5

      - name: Compile Android app
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
