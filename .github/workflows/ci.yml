name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"

      - name: Syntax-check JS files
        run: |
          set -e
          for f in background.js content.js popup.js lib/*.js services/*.js inject/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile-check Python files
        run: |
          python -m py_compile downloader.py
          python -m py_compile desktop/main.py desktop/window.py desktop/core.py desktop/settings.py desktop/ffmpeg_helper.py desktop/build.py desktop/yandex_music.py desktop/ffmpeg_installer.py
          python -m py_compile lite/main.py lite/yandex_music.py lite/ffmpeg_helper.py lite/ytdlp_worker.py lite/build.py
