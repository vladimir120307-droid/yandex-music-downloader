name: Healthcheck

# Яндекс меняет API без предупреждения. Ошибка 403 из обсуждения #62 прожила у
# людей четыре недели, прежде чем её заметили. Раз в день проверяем настоящие
# запросы и, если что-то сломалось, открываем issue — автору приходит письмо.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Сбой сети на раннере — ещё не поломка: повторяем через 5 минут
      - name: Check API
        id: check
        run: |
          run_checks() { node tests/e2e.mjs api && python tests/api_check.py; }
          run_checks || { sleep 300; run_checks; }

      - name: Open issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create healthcheck --color B60205 --description 'Автоматическая проверка API' --force
          if [ -n "$(gh issue list --label healthcheck --state open --json number --jq '.[0].number')" ]; then
            echo "Issue уже открыт"
            exit 0
          fi
          gh issue create --label healthcheck --label bug \
            --title 'Автопроверка: запросы к API Яндекс.Музыки не проходят' \
            --body "Ежедневная проверка нашла поломку, две попытки подряд. Подробности в журнале: $RUN_URL. Issue закроется сам, когда проверка снова пройдёт."

      - name: Close issue
        if: success()
        run: |
          for n in $(gh issue list --label healthcheck --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment 'Проверка снова проходит.'
          done
